name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: List dist contents
        run: ls -la dist/client/ && ls -la dist/client/assets/

      - name: Apply D1 migrations
        run: bun x wrangler d1 migrations apply DB --remote

      - name: Deploy worker
        run: bun x wrangler deploy

      - name: Verify deployment
        run: |
          sleep 3
          echo "=== /api/ping ==="
          curl -s https://e39-hunter.jsenkevich.workers.dev/api/ping
          echo
          echo "=== /api/listings shape ==="
          curl -s "https://e39-hunter.jsenkevich.workers.dev/api/listings?limit=1" | head -c 300
          echo
